# 供给源清单(M0:仅官方精选仓;M1 增加 skills.sh adapter)
# 每个 source 由 packages/pipeline/src/sources/ 下对应 adapter 处理
#
# 可选字段 category:per-source 分类覆盖(labels.ts 里的 featured slug),优先于启发式。
#   仅用于「同质垂直仓」——整仓同一品类时,例如:
#     - type: github-repo
#       repo: microsoft/azure-skills
#       category: cloud
#   异质仓(anthropics/vercel 等混合品类)**不要设** category,交给 categorize 引擎逐条判。
sources:
  - type: github-repo
    repo: anthropics/skills
    note: Anthropic 官方 skills 仓
  - type: github-repo
    repo: vercel-labs/agent-skills
    note: Vercel 官方 skills 集合
