# 供给源清单(M0:仅官方精选仓;M1 增加 skills.sh adapter)
# 每个 source 由 packages/pipeline/src/sources/ 下对应 adapter 处理
#
# 可选字段 category:per-source 分类覆盖(labels.ts 里的 featured slug),优先于启发式。
#   仅用于「同质垂直仓」——整仓同一品类时,例如:
#     - type: github-repo
#       repo: microsoft/azure-skills
#       category: cloud
#   异质仓(anthropics/vercel 等混合品类)**不要设** category,交给 categorize 引擎逐条判。
sources:
  - type: github-repo
    repo: anthropics/skills
    note: Anthropic 官方 skills 仓
  - type: github-repo
    repo: vercel-labs/agent-skills
    note: Vercel 官方 skills 集合
  # ---- 首发场景包成员仓(2026-07-08 入册:保证包成员的新鲜度与镜像覆盖) ----
  - type: github-repo
    repo: mattpocock/skills
    note: Matt Pocock 系列(product / code-review 包成员)
  - type: github-repo
    repo: larksuite/cli
    note: 飞书官方 CLI 技能(lark 包成员)
  - type: github-repo
    repo: agentspace-so/runcomfy-agent-skills
    note: AI 视频生成 / 剪辑(video 包成员)
  - type: github-repo
    repo: halt-catch-fire/skills
    note: remotion-render 等(video 包成员)
  # ---- 中文创作者源(2026-07-09 起):中文仓普遍不打英文 topic、不上 skills.sh 榜、
  # 不进英文 awesome 清单,三通道全盲——靠人工入册,中文场景是本店差异化,值得专门养这份清单 ----
  - type: github-repo
    repo: op7418/guizang-ppt-skill
    note: 归藏 · 杂志风/瑞士风网页 PPT(中文创作者头部)
