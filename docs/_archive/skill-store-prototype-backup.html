<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Store — 可交互原型</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73; --faint:#86868b;
    --line:#e6e6ea; --accent:#3b6cf0; --accent-soft:#edf2fe; --ok:#2e9e5b; --warn:#c77b12; --bad:#d0342c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 64px;}
  a{color:var(--accent);text-decoration:none;cursor:pointer;}

  /* ===== nav ===== */
  .nav{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .nav-inner{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;}
  .logo{font-weight:800;font-size:17px;cursor:pointer;white-space:nowrap;}
  .logo span{color:var(--accent);}
  .tabs{display:flex;gap:4px;}
  .tab{border:none;background:transparent;font-size:14px;color:var(--sub);padding:6px 14px;border-radius:14px;cursor:pointer;font-family:inherit;}
  .tab.on{background:var(--ink);color:#fff;font-weight:600;}
  .search{margin-left:auto;position:relative;}
  .search input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px 7px 30px;font-size:13px;width:200px;outline:none;font-family:inherit;}
  .search input:focus{border-color:var(--accent);}
  .search::before{content:"🔍";position:absolute;left:9px;top:7px;font-size:12px;opacity:.55;}

  .view{display:none;padding-top:26px;}
  .view.on{display:block;}
  .h2{font-size:21px;font-weight:800;margin-bottom:4px;}
  .h2-sub{font-size:13px;color:var(--faint);margin-bottom:16px;}
  .section{margin-top:30px;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .sec-title{font-size:17px;font-weight:700;}
  .sec-note{font-weight:400;font-size:12px;color:var(--faint);margin-left:8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;}

  /* ===== today hero ===== */
  .heroes{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hero-card{border-radius:20px;padding:22px;color:#fff;cursor:pointer;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;transition:transform .15s;}
  .hero-card:hover{transform:scale(1.015);}
  .hero-card .kicker{font-size:11px;letter-spacing:.14em;opacity:.75;text-transform:uppercase;}
  .hero-card .t{font-size:22px;font-weight:800;margin-top:2px;}
  .hero-card .d{font-size:13px;opacity:.85;margin-top:4px;max-width:340px;}
  .hero-card .big-icon{position:absolute;right:18px;top:14px;font-size:56px;opacity:.9;}

  /* ===== skill rows ===== */
  .row-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;}
  .srow{display:flex;gap:13px;align-items:center;padding:11px 8px;border-radius:14px;cursor:pointer;}
  .srow:hover{background:#ececf0;}
  .srow .num{width:18px;font-size:14px;font-weight:700;color:var(--faint);text-align:center;flex-shrink:0;}
  .s-icon{width:52px;height:52px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
  .srow .info{flex:1;min-width:0;}
  .srow .n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .srow .tg{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .srow .badges{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--faint);}
  .mini{background:#f0f0f3;border-radius:6px;padding:1px 6px;}
  .mini.score{background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .mini.safe{color:var(--ok);}
  .mini.warn{color:var(--warn);}
  .getbtn{border:none;background:#ececf0;color:var(--accent);font-weight:700;font-size:12.5px;border-radius:14px;padding:6px 16px;cursor:pointer;flex-shrink:0;font-family:inherit;}
  .getbtn.got{background:transparent;color:var(--faint);border:1px solid var(--line);}

  /* ===== category chips ===== */
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .cat-card{border-radius:14px;padding:14px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s;}
  .cat-card:hover{transform:scale(1.03);}
  .cat-card small{font-weight:400;font-size:11px;opacity:.8;}

  /* ===== browse filters ===== */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
  .fchip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:5px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;font-family:inherit;}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;}
  .filters select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;font-size:12.5px;color:var(--sub);font-family:inherit;outline:none;}
  .fcount{font-size:12px;color:var(--faint);margin-left:auto;}
  .empty{color:var(--faint);font-size:14px;text-align:center;padding:40px 0;}

  /* ===== charts view ===== */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* ===== detail (沿用 mockup) ===== */
  .topnav{font-size:13px;color:var(--accent);margin:0 0 18px;cursor:pointer;}
  .hero{display:flex;gap:20px;align-items:flex-start;}
  .icon{width:100px;height:100px;border-radius:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;}
  .hero h1{font-size:24px;font-weight:700;}
  .hero .tagline{font-size:15px;color:var(--sub);margin-top:2px;}
  .hero .dev{font-size:13px;color:var(--accent);margin-top:4px;}
  .cta-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .btn{border:none;border-radius:18px;padding:9px 26px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.get{background:var(--accent);color:#fff;}
  .btn.get.got{background:#ececf0;color:var(--faint);}
  .btn.try{background:transparent;border:1.5px solid #d2d2d7;color:var(--ink);}
  .cli{font-size:12px;color:var(--faint);background:#f0f0f3;border-radius:8px;padding:6px 10px;font-family:ui-monospace,Menlo,monospace;cursor:pointer;}
  .cli:hover{background:#e6e6ea;}

  .stats{display:flex;margin-top:22px;border-top:1px solid var(--line);padding-top:16px;text-align:center;}
  .stat{flex:1;}
  .stat + .stat{border-left:1px solid var(--line);}
  .stat b{display:block;font-size:19px;font-weight:700;}
  .stat span{font-size:11px;color:var(--faint);letter-spacing:.03em;}
  .stat .ok{color:var(--ok);}
  .stat .warn{color:var(--warn);}

  .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .pane.after{border:2px solid var(--accent);}
  .pane .label{font-size:12px;color:var(--faint);margin-bottom:10px;}
  .pane.after .label{color:var(--accent);font-weight:600;}
  .fake{border-radius:10px;height:120px;padding:12px;overflow:hidden;}
  .fake.plain{background:#f0f0f3;}
  .bar{border-radius:4px;background:#dcdce1;height:7px;margin-top:8px;}
  .bar.title{background:#c9c9cf;height:10px;width:60%;margin-top:0;}
  .fake.rich{background:linear-gradient(135deg,#1a2b5c,#2d4a8a);display:flex;flex-direction:column;justify-content:space-between;}
  .rich-title{height:10px;width:45%;background:#fff;border-radius:4px;opacity:.95;}
  .chart{display:flex;gap:8px;align-items:flex-end;height:60px;}
  .chart i{display:block;width:18%;background:#6d8df7;border-radius:3px 3px 0 0;}
  .chart i:nth-child(3){background:#9db4fa;}
  .fake.table{background:#fff;border:1px solid var(--line);padding:8px;}
  .trow{display:flex;gap:6px;margin-top:6px;}
  .trow i{display:block;height:9px;border-radius:3px;background:#e3ecfd;flex:1;}
  .trow.head i{background:var(--accent);opacity:.85;}
  .trow i:first-child{flex:0 0 26%;background:#eef2f8;}
  .trow.head i:first-child{background:var(--accent);}
  .fake.code{background:#14181f;padding:12px;font-family:ui-monospace,Menlo,monospace;}
  .cline{height:8px;border-radius:3px;margin-top:7px;background:#2c3442;}
  .cline.g{background:#2e9e5b77;}
  .cline.c{background:#6d8df766;}
  .pane .caption{font-size:12px;color:var(--faint);margin-top:10px;}
  .pane.after .caption{color:var(--accent);}
  .prompt-chip{display:inline-block;font-size:12px;background:#f0f0f3;border-radius:8px;padding:4px 10px;color:var(--sub);margin-bottom:12px;}

  .perm{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;}
  .perm > div{flex:1;padding:0 8px;}
  .perm > div + div{border-left:1px solid var(--line);}
  .perm .em{font-size:22px;}
  .perm .t{font-size:13px;font-weight:600;margin-top:5px;}
  .perm .t.ok{color:var(--ok);}
  .perm .t.warn{color:var(--warn);}
  .perm .d{font-size:11px;color:var(--faint);}

  .bench-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px;}
  .bench-row .name{width:110px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .bench-row.self .name{color:var(--ink);font-weight:600;cursor:default;}
  .track{flex:1;height:8px;border-radius:4px;background:#f0f0f3;overflow:hidden;}
  .fill{height:100%;border-radius:4px;background:#b9b9c2;}
  .bench-row.self .fill{background:var(--accent);}
  .score{width:30px;text-align:right;color:var(--sub);}
  .bench-row.self .score{color:var(--accent);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 11px;font-size:12px;}
  .link{color:var(--accent);font-size:12px;cursor:pointer;}

  .review{border-top:1px solid var(--line);padding:14px 0;}
  .review:first-of-type{border-top:none;padding-top:0;}
  .review .head{display:flex;justify-content:space-between;font-size:13px;}
  .stars{color:#f5a623;letter-spacing:1px;}
  .review .meta{color:var(--faint);font-size:12px;}
  .review p{font-size:13.5px;color:var(--ink);margin-top:6px;}
  .autoeval{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:14px;}
  .autoeval b{color:var(--accent);}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;font-size:13px;padding:10px 20px;border-radius:14px;opacity:0;transition:all .25s;z-index:99;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  footer{margin-top:44px;font-size:12px;color:var(--faint);text-align:center;}

  @media (max-width:680px){
    .heroes,.compare,.duo,.row-grid{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .stats{flex-wrap:wrap;}
    .stat{flex:1 1 33%;margin-bottom:10px;}
    .stat + .stat{border-left:none;}
    .search input{width:120px;}
    .tabs{gap:0;}
  }
</style>
</head>

/* ================= 状态 ================= */
let state = {view:"today", cat:null, q:"", agent:null, safeOnly:false, sort:"installs", detail:null};
let installed = {};
const $ = id => document.getElementById(id);
const fmt = n => n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"K" : n;
const catOf = id => CATS.find(c=>c.id===id);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function toggleInstall(ev,id){ ev.stopPropagation(); installed[id]=!installed[id]; toast(installed[id]?"已获取 "+id+"(演示)":"已移除 "+id); render(); }
function copyCli(id){ navigator.clipboard && navigator.clipboard.writeText("npx skills add "+id).then(()=>toast("命令已复制")); }

/* ================= 组件 ================= */
function securityBadge(s){
  const pending = s.perm.some(p=>p[1].includes("复核"));
  return pending ? '<span class="mini warn">⚠︎ 待复核</span>' : '<span class="mini safe">✓ 已扫描</span>';
}
function srow(s, num){
  return `<div class="srow" onclick="openDetail('${s.id}')">
    ${num?`<div class="num">${num}</div>`:""}
    <div class="s-icon" style="background:${s.g}">${s.icon}</div>
    <div class="info">
      <div class="n">${s.n}</div>
      <div class="tg">${s.tag}</div>
      <div class="badges">${securityBadge(s)}<span class="mini">${s.tokens} tok</span><span class="mini">${fmt(s.installs)} 安装</span></div>
    </div>
    <button class="getbtn ${installed[s.id]?"got":""}" onclick="toggleInstall(event,'${s.id}')">${installed[s.id]?"已获取":"获取"}</button>
  </div>`;
}
function rowGrid(list, numbered){ return `<div class="row-grid">${list.map((s,i)=>srow(s, numbered?i+1:0)).join("")}</div>`; }

/* ================= 视图:分类/搜索 ================= */
function renderBrowse(){
  let list = [...S];
  if(state.cat) list = list.filter(s=>s.cat===state.cat);
  if(state.agent) list = list.filter(s=>s.agents >= 5 || AGENTS.slice(0,s.agents).includes(state.agent));
  if(state.safeOnly) list = list.filter(s=>!s.perm.some(p=>p[1].includes("外部请求")&&p[2]==="warn") && !s.perm.some(p=>p[1].includes("复核")));
  if(state.q){ const q=state.q.toLowerCase(); list = list.filter(s=>(s.n+s.tag+s.dev+s.id).toLowerCase().includes(q)); }
  if(state.sort==="installs") list.sort((a,b)=>b.installs-a.installs);
  if(state.sort==="tokens") list.sort((a,b)=>parseInt(a.tokens.replace(/\D/g,""))-parseInt(b.tokens.replace(/\D/g,"")));
  const cname = state.cat ? catOf(state.cat).n : "全部";
  $("v-browse").innerHTML = `
    <div class="h2">${state.q?`“${state.q}” 的搜索结果`:cname}</div>
    <div class="h2-sub">${state.q?"跨全部分类检索":"按安装量或 token 成本排序"}</div>
    <div class="filters">
      <button class="fchip ${!state.cat?"on":""}" onclick="setCat(null)">全部</button>
      ${CATS.map(c=>`<button class="fchip ${state.cat===c.id?"on":""}" onclick="setCat('${c.id}')">${c.em} ${c.n}</button>`).join("")}
    </div>
    <div class="filters">
      <select onchange="state.sort=this.value;render()">
        <option value="installs" ${state.sort==="installs"?"selected":""}>按安装量</option>
        <option value="tokens" ${state.sort==="tokens"?"selected":""}>按 token 成本(低→高)</option>
      </select>
      <select onchange="state.agent=this.value||null;render()">
        <option value="">全部 Agent</option>
        ${AGENTS.map(a=>`<option ${state.agent===a?"selected":""}>${a}</option>`).join("")}
      </select>
      <button class="fchip ${state.safeOnly?"on":""}" onclick="state.safeOnly=!state.safeOnly;render()">🛡️ 仅无外联且扫描通过</button>
      <span class="fcount">${list.length} 个结果</span>
    </div>
    ${list.length ? `<div class="card" style="padding:10px 14px;">${list.map(s=>srow(s)).join("")}</div>` : `<div class="empty">没有符合条件的 skill,试试放宽筛选</div>`}`;
}
function setCat(c){ state.cat=c; render(); }
function openCat(c){ state.cat=c; state.q=""; $("q").value=""; go("browse"); }

      <div class="card">
        <div class="sec-title" style="font-size:15px;">兼容性</div>
        <div class="chips">${AGENTS.slice(0,s.agents).map(a=>`<span class="chip">${a}</span>`).join("")}</div>
        <div style="margin-top:14px;font-size:12px;color:var(--faint);">版本 ${s.ver} · <span class="link" onclick="toast('SKILL.md diff 视图(原型未实现)')">查看 SKILL.md 变更 diff ›</span></div>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">评分与评论<span class="sec-note">冷启动期由审计摘要占位</span></div>
      <div class="card">
        <div class="autoeval">🔎 <b>平台审计摘要</b>:已通过 L1 签名 / L2 五因子 / L3 意图三层审计与人工复核,权限见上。标准化评测走可复现协议(开发中),成熟后此处并入带元数据的跑分摘要。</div>
        ${s.reviews.map(r=>`<div class="review"><div class="head"><span class="stars">${"★".repeat(r[0])}${"☆".repeat(5-r[0])}</span><span class="meta">${r[1]} · ${r[2]} · 已验证安装</span></div><p>${r[3]}</p></div>`).join("")}
      </div>
    </div>`;
  window.scrollTo(0,0);
}

/* ================= 路由 ================= */
function go(v){ state.from = state.view==="detail" ? state.from : state.view; state.view=v; render(); window.scrollTo(0,0); }
function openDetail(id){ state.from = state.view==="detail" ? state.from : state.view; state.detail=id; state.view="detail"; render(); }
function onSearch(q){ state.q=q.trim(); if(state.q && state.view!=="browse"){ state.cat=null; state.view="browse"; } render(); }
function render(){
  ["today","browse","charts","detail"].forEach(v=>{ $("v-"+v).classList.toggle("on", state.view===v); const t=$("tab-"+v); if(t) t.classList.toggle("on", state.view===v); });
  if(state.view==="today") renderToday();
  if(state.view==="browse") renderBrowse();
  if(state.view==="charts") renderCharts();
  if(state.view==="detail") renderDetail();
}
render();
</script>
</body>
</html>
