<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Store · 供给聚合架构</title>
<style>
  body{background:#f5f5f7;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:980px;margin:0 auto;padding:36px 20px 56px;}
  .kicker{font-size:12px;letter-spacing:.12em;color:#3b6cf0;font-weight:700;}
  h1{font-size:24px;font-weight:800;color:#1d1d1f;margin:4px 0 2px;}
  .meta{font-size:13px;color:#86868b;margin-bottom:20px;}
  .meta b{color:#2e9e5b;}
  .board{background:#fff;border:1px solid #e6e6ea;border-radius:18px;padding:10px 6px;}
  svg{display:block;width:100%;height:auto;}
  footer{margin-top:18px;font-size:12px;color:#86868b;text-align:center;}
  @media print{body{background:#fff}.board{border:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">SUPPLY PIPELINE · 一页架构</div>
  <h1>把各处的 skill 搬到自己平台:供给聚合架构</h1>
  <div class="meta">全量索引便宜、认证稀缺 —— 漏斗本身就是商业叙事 · <b>2026-07-03 已对齐当前代码</b></div>

  <div class="board">
  <svg viewBox="0 0 940 1120" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>供给聚合架构图</title>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#a9a9b2"/>
      </marker>
      <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf0"/>
      </marker>
      <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#c77b12"/>
      </marker>
    </defs>

    <!-- ===== 左侧层级栏 ===== -->
    <g font-size="12" font-weight="700" fill="#86868b">
      <text x="24" y="64">① 供给源</text>
      <text x="24" y="248">② 采集</text>
      <text x="24" y="432">③ 合规分流</text>
      <text x="24" y="618">④ 质量漏斗</text>
      <text x="24" y="984">⑤ 发布</text>
    </g>

    <!-- ===== ① 供给源层:2 个内容源(实线) + 3 个信号源(虚线,回上游) ===== -->
    <g>
      <!-- 内容源 1:官方精选仓 -->
      <rect x="110" y="40" width="148" height="96" rx="14" fill="#edf2fe" stroke="#3b6cf0" stroke-width="1.5"/>
      <text x="184" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">官方精选仓</text>
      <text x="184" y="86" text-anchor="middle" font-size="10" fill="#6e6e73">anthropics · vercel-labs</text>
      <text x="184" y="102" text-anchor="middle" font-size="10" fill="#6e6e73">sources.yaml 白名单</text>
      <text x="184" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#3b6cf0">量小质高 · 信任底座</text>

      <!-- 内容源 2:GitHub 全域(已是可靠主通道) -->
      <rect x="273" y="40" width="148" height="96" rx="14" fill="#edf2fe" stroke="#3b6cf0" stroke-width="1.5"/>
      <text x="347" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">GitHub 全域</text>
      <text x="347" y="86" text-anchor="middle" font-size="10" fill="#6e6e73">topic:claude-skills 搜索</text>
      <text x="347" y="102" text-anchor="middle" font-size="10" fill="#6e6e73">公开稳定 Search API</text>
      <text x="347" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#3b6cf0">可靠主采集通道</text>

      <!-- 信号源 1:awesome / hub-signals -->
      <rect x="436" y="40" width="148" height="96" rx="14" fill="#fdf3e4" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="510" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5408">awesome 精选(hub)</text>
      <text x="510" y="84" text-anchor="middle" font-size="10" fill="#6e6e73">「被收录 + 归类」信号</text>
      <text x="510" y="100" text-anchor="middle" font-size="10" fill="#6e6e73">MIT 公开清单</text>
      <text x="510" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#c77b12">仅信号 · 内容回上游</text>

      <!-- 信号源 2:skills.sh -->
      <rect x="599" y="40" width="148" height="96" rx="14" fill="#fdf3e4" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="673" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5408">skills.sh 榜单</text>
      <text x="673" y="84" text-anchor="middle" font-size="10" fill="#6e6e73">解析首页 SSR 榜单</text>
      <text x="673" y="100" text-anchor="middle" font-size="10" fill="#c0392b">私有 /api/v1 实测 401</text>
      <text x="673" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#c77b12">仅热度信号</text>

      <!-- 信号源 3:第三方 Hub -->
      <rect x="762" y="40" width="148" height="96" rx="14" fill="#fdf3e4" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="836" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5408">第三方 Hub</text>
      <text x="836" y="84" text-anchor="middle" font-size="10" fill="#6e6e73">ClawHub 等 · 跨平台热度</text>
      <text x="836" y="100" text-anchor="middle" font-size="10" fill="#6e6e73">聚合是独家功能</text>
      <text x="836" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#c77b12">仅信号 · 全量过审</text>
    </g>

    <!-- 汇流箭头:实线(蓝灰)=内容流,虚线(琥珀)=信号流回上游 -->
    <g fill="none">
      <path d="M184,136 L184,196" stroke="#a9a9b2" stroke-width="1.5" marker-end="url(#arr)"/>
      <path d="M347,136 L347,196" stroke="#a9a9b2" stroke-width="1.5" marker-end="url(#arr)"/>
      <path d="M510,136 L510,196" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
      <path d="M673,136 L673,196" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
      <path d="M836,136 L836,196" stroke="#c77b12" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
    </g>
    <text x="128" y="176" font-size="10" fill="#86868b">实线 = 内容 · 虚线 = 信号(只取「哪些+归类」,内容一律回上游 GitHub 采集)</text>

    <!-- ===== ② 采集层 ===== -->
    <rect x="110" y="204" width="800" height="120" rx="16" fill="#fff" stroke="#3b6cf0" stroke-width="2"/>
    <text x="132" y="232" font-size="13.5" font-weight="700" fill="#1d1d1f">定时采集管线(GitHub Action,每日)· 五源殊途同归,统一回上游采集</text>
    <g font-size="11.5" fill="#1d1d1f">
      <rect x="132" y="248" width="106" height="52" rx="9" fill="#f0f0f3"/>
      <text x="185" y="270" text-anchor="middle">shallow clone</text>
      <text x="185" y="288" text-anchor="middle" font-size="9.5" fill="#86868b">--depth1 + ls-tree</text>

      <rect x="260" y="248" width="106" height="52" rx="9" fill="#f0f0f3"/>
      <text x="313" y="270" text-anchor="middle">frontmatter 校验</text>
      <text x="313" y="288" text-anchor="middle" font-size="9.5" fill="#86868b">name · description</text>

      <rect x="388" y="248" width="106" height="52" rx="9" fill="#f0f0f3"/>
      <text x="441" y="270" text-anchor="middle">元数据 + 归类</text>
      <text x="441" y="288" text-anchor="middle" font-size="9.5" fill="#86868b">licence·scripts·category</text>

      <rect x="516" y="248" width="106" height="52" rx="9" fill="#f0f0f3"/>
      <text x="569" y="270" text-anchor="middle">规范 ID</text>
      <text x="569" y="288" text-anchor="middle" font-size="9.5" fill="#86868b">owner/repo/name</text>

      <rect x="644" y="248" width="106" height="52" rx="9" fill="#f0f0f3"/>
      <text x="697" y="270" text-anchor="middle">哈希去重</text>
      <text x="697" y="288" text-anchor="middle" font-size="9.5" fill="#86868b">折叠采样 MAX/repo</text>

      <rect x="772" y="248" width="116" height="52" rx="9" fill="#edf2fe"/>
      <text x="830" y="270" text-anchor="middle" font-weight="700" fill="#3b6cf0">记录 commit SHA</text>
      <text x="830" y="288" text-anchor="middle" font-size="9.5" fill="#3b6cf0">溯源锚点</text>
    </g>
    <g stroke="#a9a9b2" stroke-width="1.3" fill="none">
      <path d="M238,274 L254,274" marker-end="url(#arr)"/>
      <path d="M366,274 L382,274" marker-end="url(#arr)"/>
      <path d="M494,274 L510,274" marker-end="url(#arr)"/>
      <path d="M622,274 L638,274" marker-end="url(#arr)"/>
      <path d="M750,274 L766,274" marker-end="url(#arr)"/>
    </g>

    <!-- 持续同步回环 -->
    <path d="M910,264 Q934,264 934,180 Q934,88 916,88" stroke="#3b6cf0" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)"/>
    <text x="936" y="170" font-size="10.5" font-weight="700" fill="#3b6cf0" transform="rotate(90 936 170)" text-anchor="middle">每日 diff 上游 · 变更即重审</text>

    <path d="M510,324 L510,352" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- ===== ③ 合规分流(= 两段式采集的落盘分层)===== -->
    <g>
      <rect x="110" y="360" width="388" height="120" rx="16" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5"/>
      <text x="304" y="388" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d6e3f">托管型 · mirrored</text>
      <text x="304" y="410" text-anchor="middle" font-size="11.5" fill="#1d1d1f">MIT / Apache 等宽松 licence</text>
      <text x="304" y="428" text-anchor="middle" font-size="11.5" fill="#1d1d1f"><tspan font-weight="700">--mirror</tspan> 才拷完整副本(否则仅 SKILL.md)</text>
      <text x="304" y="456" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2e9e5b">进入质量漏斗 ↓</text>

      <rect x="522" y="360" width="388" height="120" rx="16" fill="#fdf3e4" stroke="#c77b12" stroke-width="1.5"/>
      <text x="716" y="388" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5408">索引型 · indexed(默认)</text>
      <text x="716" y="410" text-anchor="middle" font-size="11.5" fill="#1d1d1f">无 licence / 专有,或未开 --mirror</text>
      <text x="716" y="428" text-anchor="middle" font-size="11.5" fill="#1d1d1f">只存元数据 · 跳转上游安装</text>
      <text x="716" y="456" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c77b12">两段式默认层 · 配 DMCA 下架</text>
    </g>
    <text x="510" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b6cf0">两段式采集:默认仅索引(index-only,可扩到万级)· --mirror 才进托管层</text>

    <path d="M304,480 L304,508" stroke="#2e9e5b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M716,480 L716,508 Q716,520 704,520 L560,520" stroke="#c77b12" stroke-width="1.3" fill="none" stroke-dasharray="4 4"/>
    <text x="762" y="504" font-size="10" fill="#c77b12">仅元数据入索引</text>

    <!-- ===== ④ 质量漏斗 ===== -->
    <g>
      <rect x="120" y="524" width="780" height="66" rx="12" fill="#f0f0f3" stroke="#d2d2d7"/>
      <text x="146" y="551" font-size="13" font-weight="700" fill="#1d1d1f">全量索引</text>
      <text x="146" y="571" font-size="11" fill="#6e6e73">只存元数据,近零成本 · 可搜索、跳转上游</text>
      <text x="874" y="558" text-anchor="end" font-size="15" font-weight="800" fill="#6e6e73">~100 万</text>
      <text x="874" y="576" text-anchor="end" font-size="9.5" fill="#a9a9b2">规划目标</text>

      <path d="M510,590 L510,612" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <text x="524" y="608" font-size="10.5" fill="#86868b">安装量 / 星标 / 活跃度筛选</text>

      <rect x="200" y="618" width="620" height="66" rx="12" fill="#e6ecfb" stroke="#b9cbf5"/>
      <text x="226" y="645" font-size="13" font-weight="700" fill="#1d1d1f">头部候选</text>
      <text x="226" y="665" font-size="11" fill="#6e6e73">值得花审计成本的部分</text>
      <text x="794" y="653" text-anchor="end" font-size="15" font-weight="800" fill="#3b6cf0">~5 千</text>
      <text x="794" y="671" text-anchor="end" font-size="9.5" fill="#a9a9b2">规划目标</text>

      <path d="M510,684 L510,706" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

      <rect x="270" y="712" width="480" height="88" rx="12" fill="#edf2fe" stroke="#3b6cf0" stroke-width="1.5"/>
      <text x="510" y="736" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">四层安全审计 + 可复现评测<tspan fill="#c77b12">(评测开发中)</tspan></text>
      <text x="510" y="756" text-anchor="middle" font-size="10.5" fill="#6e6e73">L1 静态签名 · L2 五因子数据流 · L3 LLM 意图 · 人工复核</text>
      <text x="510" y="773" text-anchor="middle" font-size="10.5" fill="#6e6e73">五因子:scripts · network · filesystem · env · commands</text>
      <text x="510" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#c77b12">含 network 一律 ≥ needs_review · ✗ 不过 → 退回索引型</text>

      <path d="M510,800 L510,822" stroke="#3b6cf0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>

      <rect x="340" y="828" width="340" height="76" rx="12" fill="#3b6cf0"/>
      <text x="510" y="857" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">认证货架</text>
      <text x="510" y="879" text-anchor="middle" font-size="11" fill="#dbe5fd">安全审计 + 权限营养标签 + 可复现评测</text>
      <text x="700" y="853" font-size="15" font-weight="800" fill="#3b6cf0">~2 千</text>
      <text x="700" y="870" font-size="9.5" fill="#a9a9b2">目标 · 当前 73</text>
    </g>

    <path d="M510,904 L510,930" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- ===== ⑤ 发布层 ===== -->
    <g>
      <rect x="140" y="938" width="220" height="80" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
      <text x="250" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">Git 仓库 = 事实源</text>
      <text x="250" y="988" text-anchor="middle" font-size="10.5" fill="#6e6e73">审计报告随库公开 · PR 留痕</text>

      <rect x="392" y="938" width="220" height="80" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
      <text x="502" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">增量同步 DB + 缓存</text>
      <text x="502" y="988" text-anchor="middle" font-size="10.5" fill="#6e6e73">每条记录带 commit 溯源</text>

      <rect x="644" y="938" width="220" height="80" rx="14" fill="#edf2fe" stroke="#3b6cf0" stroke-width="2"/>
      <text x="754" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#3b6cf0">商店前端</text>
      <text x="754" y="988" text-anchor="middle" font-size="10.5" fill="#6e6e73">分类 · 榜单 · 详情 · 一键安装</text>

      <path d="M360,978 L384,978" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <path d="M612,978 L636,978" stroke="#a9a9b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    </g>

    <!-- 底部注 -->
    <text x="510" y="1064" text-anchor="middle" font-size="11.5" fill="#86868b">冷启动顺序:① 官方精选仓 → ② GitHub 全域(topic:claude-skills)→ hub / skills.sh 榜单全程仅作筛选信号、回上游采集;跨平台热度聚合是独家功能</text>
    <text x="510" y="1088" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b6cf0">漏斗数字为规划量级(已索引 ~100 万 / 认证 ~2 千 = 目标,当前 catalog 73 条)· 高危源一律全量过审,无免检通道</text>
  </svg>
  </div>

  <footer>Skill Store 供给聚合架构 · 2026-07-03 已对齐当前代码(topic:claude-skills · 源顺序 · 两段式采集 · 四层审计 · 采集期归类)· 参考 aiskillstore 管线 + Snyk/SkillsBench 审计实践</footer>
</div>
</body>
</html>
