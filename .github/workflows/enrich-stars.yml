name: Enrich Stars

# 定时给 catalog 补 GitHub stars(signals.stars_github)。clone 采集的条目 stars 为 null,
# 这里用 GitHub API 按仓去重查询写回。变更走 PR(与「catalog 变更走 PR」一致)。

on:
  schedule:
    - cron: "0 5 * * 1" # 每周一 05:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "忽略新鲜度截止线,全量重拉"
        type: boolean
        default: false

concurrency:
  group: enrich-stars
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 补 stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Actions 自带,5000 次/小时
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run enrich:stars -- --force
          else
            npm run enrich:stars
          fi

      - name: 有变化则开 PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: signals/stars
          commit-message: "chore(signals): 刷新 GitHub stars"
          title: "chore(signals): 刷新 GitHub stars"
          body: |
            自动补 `catalog/**/skill-report.json` 的 `signals.stars_github`(按仓去重、带新鲜度截止线)。
            纯机械数据刷新,核对无误即可合入。
          labels: signals
