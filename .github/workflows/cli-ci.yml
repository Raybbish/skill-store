name: CLI CI

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "scripts/pack-zips.mjs"
      - "scripts/artifact-store.mjs"
      - "scripts/lib/artifact-store-core.mjs"
      - "packages/pipeline/src/hash.ts"
      - "packages/web/lib/artifacts-server.ts"
      - "packages/web/lib/data.ts"
      - "packages/web/lib/skill-types.ts"
      - "packages/web/app/skill/**/InstallBox.tsx"
      - "packages/web/app/pack/**/PackView.tsx"
      - "packages/web/lib/i18n/index.ts"
      - "packages/web/public/install.sh"
      - "packages/pipeline/src/jobs/sync.ts"
      - "infra/schema.sql"
      - "infra/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: CLI syntax and end-to-end tests
        run: |
          node --check packages/cli/bin/oh-my-skill.mjs
          node --check packages/cli/lib/content-hash.mjs
          node --check packages/cli/lib/artifact.mjs
          node --check scripts/pack-zips.mjs
          node --check scripts/artifact-store.mjs
          node --check scripts/lib/artifact-store-core.mjs
          npm test -w oh-my-skill
          bash -n packages/web/public/install.sh
      - name: Full catalog artifact preflight
        env:
          PACK_PREFLIGHT_ONLY: "1"
          PACK_OUT: /tmp/oms-artifact-preflight/dl
          PACK_ARTIFACT_OUT: /tmp/oms-artifact-preflight/artifacts
        run: node scripts/pack-zips.mjs
      - name: Typecheck
        run: npm run typecheck
