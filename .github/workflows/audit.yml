name: Audit Skills

on:
  workflow_dispatch:
    inputs:
      all:
        description: "重审全部条目(默认只审 pending)"
        type: boolean
        default: false
  # ingest PR 合并进 main 后自动审计新条目
  push:
    branches: [main]
    paths:
      - "catalog/**/skill-report.json"

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run audit
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            npm run audit -- --all
          else
            npm run audit
          fi

      - name: Create PR with audit results
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: catalog/
          branch: audit/${{ github.run_id }}
          commit-message: "chore(audit): L1/L2 static audit"
          title: "Audit: L1/L2 static scan results"
          body: |
            L1/L2 静态审计结果。合并前请处理:
            - `needs_review` 条目逐条人工复核(证据在各 skill-report.json 的 evidence)
            - critical 命中需重点排查
            - 哈希漂移条目需先重新 ingest
