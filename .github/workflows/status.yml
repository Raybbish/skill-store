# push 校验 scripts/status.mjs 可运行;快照产物(STATUS.generated.md/STATUS.html)已退出 git 跟踪
# (ADR 0031):本文件不再提交任何东西——此前定时直推 main 与各 PR 两头写同一文件,是 docs 冲突的主源。
# 看数字:本地 npm run status。
name: status
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/status.mjs
