name: Ingest Skills

on:
  schedule:
    - cron: "0 3 * * *" # 每日 03:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "只跑某个源(如 anthropics/skills),留空全跑"
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 全源采集需逐仓 shallow clone,60 分钟可能不够
    permissions:
      contents: write
      pull-requests: write
    env:
      # 有配 LLM_API_KEY 才跑下面的富化步骤;缺 key 则整段跳过,退化为「只采集不富化」(加本 workflow 前的行为)
      HAS_LLM: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            npm run ingest -- --source "${{ inputs.source }}"
          else
            # 全源采集:官方仓 + GitHub 全域 topic 头部(每仓折叠采样)+ awesome 精选信号 + skills.sh 安装量榜
            # + Code Search 全网扫描(ADR 0019 S1:filename:SKILL.md 切片续扫,游标在 catalog/_meta/code-search-state.json)
            npm run ingest -- --github-search 100 --hub-signals 300 --skills-sh 200 --code-search 30
          fi

      # ---- LLM 富化(ADR 0022/0025):采集完成后补中英文微文案 + 怎么用,随同一条 ingest/daily PR 落库 ----
      # Secret:LLM_API_KEY(必填)。LLM_BASE_URL / LLM_MODEL 可选,缺省 deepseek;非 deepseek 服务再加对应 Secret。
      # 两步都 continue-on-error:LLM 故障(限流/超时/欠费)不阻断 catalog PR,退化为「本轮只采集不富化」,下轮续补。
      - name: 补微文案(中英)+ 分类  # categorize:llm(输入 name+description,便宜;按 content_hash 增量,只补新/过期)
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: npm run categorize:llm -- --scope missing-copy

      - name: 补怎么用(中英,热门集)  # howto:llm(输入整篇 SKILL.md,单条重;--scope hot 限热门集控成本)
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        timeout-minutes: 30 # howto 单条吃 ~4k tokens;限时保证不拖垮整趟,本轮没跑完的下轮续补(增量锚 content_hash)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: npm run howto:llm -- --scope hot

      - name: Create PR with catalog changes
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: catalog/
          # 固定分支:滚动更新同一条 PR。原先用 ${{ github.run_id }} 每次 run 都是新分支→新 PR,导致每天堆一条(见 #24/#25/#26/#31)
          branch: ingest/daily
          commit-message: "chore(ingest): daily catalog update"
          title: "Ingest: daily catalog update"
          body: |
            自动采集产生的 catalog 变更。合并前请抽查:
            - 新增条目的 license/hosting 分流是否正确
            - frontmatter 不合规条目
            - catalog/lists/ 清单记录(ADR 0019:跨仓拷贝记 appearance 不落条目;拦截仓 blocked 零内容)
            - Code Search 新仓质量与游标推进(catalog/_meta/code-search-state.json)
            - skills.sh 榜单解析条数(页面结构变化会解析失败,见日志)
