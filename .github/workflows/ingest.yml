name: Ingest Skills

on:
  schedule:
    - cron: "0 3 * * *" # 每日 03:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "只跑某个源(如 anthropics/skills),留空全跑"
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 全源采集需逐仓 shallow clone,60 分钟可能不够
    permissions:
      contents: write
      pull-requests: write
    env:
      # 有配 LLM_API_KEY 才跑下面的富化步骤;缺 key 则整段跳过,退化为「只采集不富化」(加本 workflow 前的行为)
      HAS_LLM: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # ADR 0027:接续上一轮未合并的 ingest/daily,候选跨运行累积,不再互相覆盖
      # (旧行为:每轮从 main 重算 + force-update 同一 PR,前一轮未合并的新增被整体抹掉,见 07-14 28→27)。
      # 浅克隆下 merge base 可能不可达 → deepen;冲突(如 main 上退市/改档)则放弃接续,本轮从 main 重算。
      - name: Resume unmerged ingest/daily
        if: ${{ !inputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --deepen=50 origin main ingest/daily || { echo "ingest/daily 不存在,跳过接续"; exit 0; }
          git merge --no-edit origin/ingest/daily \
            || { echo "::warning::ingest/daily 接续合并失败(冲突或浅克隆无 merge base),本轮从 main 重算"; git merge --abort || true; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # continue-on-error:ingest 以非零码收尾时(单源故障,ADR 0027)不中断后续步骤,
      # catalog PR 照常产出;末端 gate 再把整个 job 置红,保证「停摆可见」。
      - name: Run ingest
        id: ingest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            npm run ingest -- --source "${{ inputs.source }}"
          else
            # 全源采集:官方仓 + GitHub 全域 topic 头部(每仓折叠采样)+ awesome 精选信号 + skills.sh 安装量榜
            # ⚠ Code Search 全网扫描已拆至 code-search.yml 错峰跑(ADR 0030):topic 搜索 + 大量 clone
            # 之后紧接全网 code search,同 token 会触发 GitHub 小时级二级封禁(07-16 复发实锤)
            npm run ingest -- --github-search 100 --hub-signals 300 --skills-sh 200
          fi

      # ---- LLM 富化(ADR 0022/0025):采集完成后补中英文微文案 + 怎么用,随同一条 ingest/daily PR 落库 ----
      # Secret:LLM_API_KEY(必填)。LLM_BASE_URL / LLM_MODEL 可选,缺省 deepseek;非 deepseek 服务再加对应 Secret。
      # 两步都 continue-on-error:LLM 故障(限流/超时/欠费)不阻断 catalog PR,退化为「本轮只采集不富化」,下轮续补。
      - name: 补微文案(中英)+ 分类  # categorize:llm(输入 name+description,便宜;按 content_hash 增量,只补新/过期)
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: npm run categorize:llm -- --scope missing-copy

      - name: 补怎么用(中英,热门集)  # howto:llm(输入整篇 SKILL.md,单条重;--scope hot 限热门集控成本)
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        timeout-minutes: 30 # howto 单条吃 ~4k tokens;限时保证不拖垮整趟,本轮没跑完的下轮续补(增量锚 content_hash)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: npm run howto:llm -- --scope hot

      - name: 补怎么用(新上架,近3天) # star 是滞后指标:hot/min-stars 圈不到新增条目,按 first_seen_at 即时补(每天一两百条,费用可控;锚幂等,与 hot 重叠零成本)
        if: env.HAS_LLM == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: npm run howto:llm -- --scope recent

      - name: Create PR with catalog changes
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: catalog/
          # 固定分支:滚动更新同一条 PR。原先用 ${{ github.run_id }} 每次 run 都是新分支→新 PR,导致每天堆一条(见 #24/#25/#26/#31)
          # 手动单源任务走独立分支 ingest/manual,不覆盖每日累积的 ingest/daily(ADR 0027)
          branch: ${{ !inputs.source && 'ingest/daily' || 'ingest/manual' }}
          commit-message: "chore(ingest): daily catalog update"
          title: "Ingest: daily catalog update"
          body: |
            自动采集产生的 catalog 变更。合并前请抽查:
            - 新增条目的 license/hosting 分流是否正确
            - frontmatter 不合规条目
            - catalog/lists/ 清单记录(ADR 0019:跨仓拷贝记 appearance 不落条目;拦截仓 blocked 零内容)
            - Code Search 新仓质量与游标推进(catalog/_meta/code-search-state.json)
            - skills.sh 榜单解析条数(页面结构变化会解析失败,见日志)

      # ADR 0027:ingest 非零退出时,PR 已照常产出,但整个 job 必须置红——
      # 「每天 Actions 成功」曾长期掩盖「长尾发现线三次运行零成功响应」。
      # (Code Search 线已拆至 code-search.yml,其停摆由该 workflow 自身的 gate 置红,ADR 0030)
      - name: Fail if ingest degraded
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::ingest 以非零码退出(单源故障),catalog PR 已照常产出,请查 Run ingest 日志"
          exit 1
